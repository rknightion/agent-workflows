name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: just check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the documented floor; 3.15 is the newest release.
        python-version: ['3.12', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Confirm the interpreter
        env:
          EXPECTED: ${{ matrix.python-version }}
        run: |
          python3 --version
          python3 -c 'import os, sys; v = "%d.%d" % sys.version_info[:2]; sys.exit(0 if v == os.environ["EXPECTED"] else f"python3 is {v}, expected the matrix version")'

      - name: just check
        run: just check
